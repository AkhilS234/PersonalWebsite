<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 870" role="img" aria-labelledby="title desc"><title id="title">Agent platform system topology</title><desc id="desc">The client sends requests to FastAPI. FastAPI saves jobs in Postgres. Workers claim jobs with SKIP LOCKED and heartbeat leases, persist checkpoints, call the Anthropic API, read and write ERPNext, and publish observability signals.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#63798b"/></marker></defs><style>text{font-family:Verdana,Geneva,sans-serif;fill:#1C2228}.eyebrow{font-size:12px;font-weight:700;letter-spacing:2px;fill:#526d80}.heading{font-size:21px;font-weight:700}.body{font-size:16px;font-weight:500;fill:#1C2228}.mono{font-family:Verdana,Geneva,sans-serif;font-size:15px;font-weight:500;fill:#1C2228}.label{font-size:14px;font-weight:500;fill:#344d60}.line{fill:none;stroke:#63798b;stroke-width:2;marker-end:url(#arrow);stroke-linejoin:round}.card{fill:#f8fafc;stroke:#b4c3cf;stroke-width:1.3}</style><rect width="1200" height="870" rx="18" fill="#edf2f6"/><text x="36" y="40" class="eyebrow">01 / SYSTEM TOPOLOGY</text><text x="36" y="73" class="heading">One queue. Durable state. Independent workers.</text><rect x="36" y="110" width="340" height="112" rx="12" class="card"/><text x="58" y="136" class="eyebrow">ENTRY POINT</text><text x="58" y="165" class="heading">Client</text><text x="58" y="193" class="mono">/ui · POST /requests</text><rect x="460" y="110" width="704" height="112" rx="12" class="card"/><text x="482" y="136" class="eyebrow">REQUEST INTAKE</text><text x="482" y="165" class="heading">API · FastAPI</text><text x="482" y="193" class="mono">31 endpoints · writes rows, never runs agents</text><path d="M376 166 H460" class="line"/><text x="386" y="145" class="label">request</text><path d="M810 222 V277" class="line"/><text x="830" y="252" class="label">insert into agent_jobs</text><rect x="36" y="278" width="1128" height="225" rx="12" class="card" style="fill:#dbe6ee"/><text x="58" y="304" class="eyebrow">COORDINATION &amp; PERSISTENCE</text><text x="58" y="333" class="heading">Postgres</text><text x="58" y="361" class="mono">requests · agent_jobs (the queue) · pending_approvals · erp_writes</text><text x="58" y="384" class="mono">bundle_conflicts · cross_request_conflicts · release_gate_verdicts</text><text x="58" y="407" class="mono">agent_decisions (append-only audit) · tenant_spend · tenants · users</text><text x="58" y="430" class="mono">LangGraph checkpoints · checkpoint_blobs · checkpoint_writes</text><rect x="36" y="602" width="390" height="166" rx="12" class="card"/><text x="58" y="628" class="eyebrow">EXECUTION</text><text x="58" y="657" class="heading">worker.py</text><text x="58" y="685" class="mono">polls every 2 s · N replicas safe</text><text x="58" y="708" class="body">claim: SKIP LOCKED</text><text x="58" y="731" class="body">+ heartbeat lease</text><path d="M130 602 V503" class="line"/><text x="145" y="547" class="label">claim jobs</text><path d="M330 602 V503" class="line"/><text x="345" y="548" class="label">persist interrupt</text><text x="345" y="567" class="label">state (checkpoints)</text><rect x="664" y="540" width="500" height="105" rx="12" class="card" style="fill:#e4e5f4"/><text x="686" y="566" class="eyebrow">MODEL</text><text x="686" y="595" class="heading">Anthropic API · Claude</text><text x="686" y="623" class="mono">prompt caching · ~20 model calls per request</text><rect x="664" y="665" width="500" height="105" rx="12" class="card"/><text x="686" y="691" class="eyebrow">BUSINESS SYSTEM</text><text x="686" y="720" class="heading">ERPNext</text><text x="686" y="748" class="mono">read · write · read-back verify</text><path d="M426 640 H536 V591 H664" class="line"/><text x="468" y="620" class="label">LLM calls</text><path d="M426 698 H664" class="line"/><text x="482" y="685" class="label">writes</text><rect x="664" y="790" width="500" height="62" rx="12" class="card"/><text x="686" y="815" class="body">Prometheus → Grafana · Alertmanager</text><text x="686" y="839" class="body">OTel → Loki for logs</text><path d="M426 743 H536 V821 H664" class="line"/><text x="552" y="805" class="label">/metrics</text></svg>