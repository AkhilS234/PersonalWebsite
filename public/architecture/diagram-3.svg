<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1370" role="img" aria-label="02 / Orchestration &amp; human checkpoints"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#63798b"/></marker></defs><style>text{font-family:Verdana,Geneva,sans-serif;fill:#1C2228}.title{font-size:22px;font-weight:700}.head{font-size:17px;font-weight:700}.body{font-size:15px;font-weight:500;fill:#1C2228}.mono{font-family:Verdana,Geneva,sans-serif;font-size:14px;font-weight:500;fill:#1C2228}.cap{font-size:12px;font-weight:700;letter-spacing:1.5px;fill:#526d80}.edge{fill:none;stroke:#63798b;stroke-width:2;marker-end:url(#a)} </style><rect width="1200" height="1370" rx="18" fill="#edf2f6"/><text x="30" y="42" class="title">02 / Orchestration &amp; human checkpoints</text><rect x="400" y="80" width="400" height="60" rx="11" fill="#f8fafc" stroke="#b4c3cf"/><text x="418" y="109" class="head">Client submits request</text><rect x="350" y="180" width="500" height="111" rx="11" fill="#e4e5f4" stroke="#b4c3cf"/><text x="368" y="209" class="head">Orchestrator agent</text><text x="368" y="235" class="mono">detect → assemble → options</text><text x="368" y="258" class="mono">propose_sub_tasks (≤5, one dependency level)</text><text x="880" y="214" class="body">Claude + prompt caching</text><text x="880" y="240" class="body">Counts toward tenant spend cap</text><rect x="350" y="330" width="500" height="111" rx="11" fill="#f1e4cb" stroke="#b4c3cf"/><text x="368" y="359" class="head">CP1 · Split review</text><text x="368" y="385" class="mono">interrupt(): edit or approve the split</text><text x="368" y="408" class="mono">approve · revise (up to 3 rounds) · reject</text><text x="35" y="367" class="body">Each gate is a LangGraph interrupt().</text><text x="35" y="392" class="body">Paused state persists in Postgres</text><text x="35" y="417" class="body">and survives a worker restart.</text><rect x="350" y="480" width="500" height="88" rx="11" fill="#f8fafc" stroke="#b4c3cf"/><text x="368" y="509" class="head">execute_approved</text><text x="368" y="535" class="mono">Enqueue N child jobs; dependencies held</text><rect x="35" y="660" width="350" height="111" rx="11" fill="#e4e5f4" stroke="#b4c3cf"/><text x="53" y="689" class="head">Use case A</text><text x="53" y="715" class="mono">agent → gate (part review)</text><text x="53" y="738" class="mono">its own LangGraph thread</text><path d="M600 591 V625 H210 V660" class="edge"/><rect x="425" y="660" width="350" height="111" rx="11" fill="#e4e5f4" stroke="#b4c3cf"/><text x="443" y="689" class="head">Use case B</text><text x="443" y="715" class="mono">agent → gate (part review)</text><text x="443" y="738" class="mono">its own LangGraph thread</text><path d="M600 591 V625 H600 V660" class="edge"/><rect x="815" y="660" width="350" height="111" rx="11" fill="#e4e5f4" stroke="#b4c3cf"/><text x="833" y="689" class="head">Use case C</text><text x="833" y="715" class="mono">agent → gate (part review)</text><text x="833" y="738" class="mono">its own LangGraph thread</text><path d="M600 591 V625 H990 V660" class="edge"/><text x="35" y="635" class="cap">N parallel lanes</text><rect x="350" y="830" width="500" height="111" rx="11" fill="#f8fafc" stroke="#b4c3cf"/><text x="368" y="859" class="head">Fan-in · maybe_advance_request</text><text x="368" y="885" class="mono">inject dependency plans</text><text x="368" y="908" class="mono">fail_by_dependency</text><path d="M210 771 V800 H600 V830" class="edge"/><path d="M600 771 V800 H600 V830" class="edge"/><path d="M990 771 V800 H600 V830" class="edge"/><rect x="350" y="980" width="500" height="88" rx="11" fill="#f8fafc" stroke="#b4c3cf"/><text x="368" y="1009" class="head">Combiner · pure code, no LLM</text><text x="368" y="1035" class="mono">conflict check → bundle_conflicts</text><rect x="350" y="1110" width="500" height="111" rx="11" fill="#f1e4cb" stroke="#b4c3cf"/><text x="368" y="1139" class="head">CP2 · Bundle approval</text><text x="368" y="1165" class="mono">interrupt(): approve, reject or revise each part</text><text x="368" y="1188" class="mono">Verdicts parked on agent_jobs.cp2_decision</text><rect x="350" y="1250" width="500" height="88" rx="11" fill="#f8fafc" stroke="#b4c3cf"/><text x="368" y="1279" class="head">execute_bundle → act</text><text x="368" y="1305" class="mono">ERPNext writes + read-back verify → Request resolved</text><path d="M600 140 V180" class="edge"/><path d="M600 291 V330" class="edge"/><path d="M600 441 V480" class="edge"/><path d="M600 941 V980" class="edge"/><path d="M600 1068 V1110" class="edge"/><path d="M600 1221 V1250" class="edge"/></svg>