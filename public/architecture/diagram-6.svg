<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1440" role="img" aria-label="05 / Postgres · the platform’s coordinator"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#63798b"/></marker></defs><style>text{font-family:Verdana,Geneva,sans-serif;fill:#1C2228}.title{font-size:22px;font-weight:700}.head{font-size:17px;font-weight:700}.body{font-size:15px;font-weight:500;fill:#1C2228}.mono{font-family:Verdana,Geneva,sans-serif;font-size:14px;font-weight:500;fill:#1C2228}.cap{font-size:12px;font-weight:700;letter-spacing:1.5px;fill:#526d80}.edge{fill:none;stroke:#63798b;stroke-width:2;marker-end:url(#a)} </style><rect width="1400" height="1440" rx="18" fill="#edf2f6"/><text x="30" y="42" class="title">05 / Postgres · the platform’s coordinator</text><text x="35" y="85" class="cap">MULTI-TENANCY</text><rect x="35" y="105" width="350" height="134" rx="11" fill="#dbe6ee" stroke="#b4c3cf"/><text x="53" y="134" class="head">tenants</text><text x="53" y="160" class="mono">id PK</text><text x="53" y="183" class="mono">slug UNIQUE</text><text x="53" y="206" class="mono">name · is_active</text><rect x="435" y="105" width="480" height="157" rx="11" fill="#dbe6ee" stroke="#b4c3cf"/><text x="453" y="134" class="head">users</text><text x="453" y="160" class="mono">id PK · email UNIQUE</text><text x="453" y="183" class="mono">name · role · is_active</text><text x="453" y="206" class="mono">tenant_id → tenants</text><text x="453" y="229" class="mono">token_hash UNIQUE</text><path d="M435 185 H385" class="edge"/><text x="365" y="170" class="body">tenant_id</text><text x="960" y="150" class="body">Every tenant-scoped table carries</text><text x="960" y="176" class="body">tenant_id → tenants</text><text x="960" y="202" class="body">Every checkpoint read is tenant-gated.</text><text x="35" y="330" class="cap">REQUEST LIFECYCLE</text><rect x="35" y="355" width="380" height="203" rx="11" fill="#f8fafc" stroke="#b4c3cf"/><text x="53" y="384" class="head">requests</text><text x="53" y="410" class="mono">request_id PK</text><text x="53" y="433" class="mono">tenant_id → tenants</text><text x="53" y="456" class="mono">raw_request · source</text><text x="53" y="479" class="mono">orchestrator_output JSONB</text><text x="53" y="502" class="mono">split_decision JSONB</text><text x="53" y="525" class="mono">status · token_est</text><rect x="500" y="355" width="425" height="295" rx="11" fill="#f8fafc" stroke="#b4c3cf"/><text x="518" y="384" class="head">agent_jobs · one row per run</text><text x="518" y="410" class="mono">thread_id PK</text><text x="518" y="433" class="mono">request_id → requests</text><text x="518" y="456" class="mono">use_case · industry · params JSONB</text><text x="518" y="479" class="mono">sub_task_id · depends_on JSONB</text><text x="518" y="502" class="mono">status (indexed)</text><text x="518" y="525" class="mono">lease_expires_at</text><text x="518" y="548" class="mono">resume_decision · resume_payload</text><text x="518" y="571" class="mono">cp2_decision · result (JSONB)</text><text x="518" y="594" class="mono">code_version · error</text><text x="518" y="617" class="mono">triggered/resolved_by_user</text><rect x="1010" y="355" width="355" height="157" rx="11" fill="#f8fafc" stroke="#b4c3cf"/><text x="1028" y="384" class="head">pending_approvals</text><text x="1028" y="410" class="mono">thread_id PK → agent_jobs</text><text x="1028" y="433" class="mono">use_case · approver</text><text x="1028" y="456" class="mono">proposed_action</text><text x="1028" y="479" class="mono">inbox row while waiting at a gate</text><path d="M415 430 H500" class="edge"/><text x="435" y="415" class="body">1 : N</text><path d="M925 430 H1010" class="edge"/><text x="945" y="415" class="body">1 : 1</text><rect x="35" y="620" width="380" height="157" rx="11" fill="#f8fafc" stroke="#b4c3cf"/><text x="53" y="649" class="head">agent_decisions</text><text x="53" y="675" class="mono">id PK · thread_id → agent_jobs</text><text x="53" y="698" class="mono">approver · gate_mode</text><text x="53" y="721" class="mono">options · decision</text><text x="53" y="744" class="mono">append-only audit, can’t be deleted</text><rect x="1010" y="565" width="355" height="157" rx="11" fill="#f8fafc" stroke="#b4c3cf"/><text x="1028" y="594" class="head">tenant_spend</text><text x="1028" y="620" class="mono">tenant_id PK → tenants</text><text x="1028" y="643" class="mono">input / output tokens</text><text x="1028" y="666" class="mono">run_count</text><text x="1028" y="689" class="mono">spend_limit_tokens</text><rect x="500" y="690" width="425" height="157" rx="11" fill="#f8fafc" stroke="#b4c3cf"/><text x="518" y="719" class="head">erp_writes</text><text x="518" y="745" class="mono">id PK · thread_id → agent_jobs</text><text x="518" y="768" class="mono">operation · line_id</text><text x="518" y="791" class="mono">status · http_status</text><text x="518" y="814" class="mono">idempotency_key UNIQUE</text><path d="M500 565 H465 V660 H415" class="edge"/><text x="430" y="610" class="body">1 : N</text><path d="M710 650 V690" class="edge"/><text x="730" y="678" class="body">1 : N</text><text x="35" y="930" class="cap">CONFLICTS &amp; RELEASE GATE</text><rect x="35" y="955" width="400" height="157" rx="11" fill="#f8fafc" stroke="#b4c3cf"/><text x="53" y="984" class="head">bundle_conflicts</text><text x="53" y="1010" class="mono">id PK · request_id → requests</text><text x="53" y="1033" class="mono">part_a · part_b</text><text x="53" y="1056" class="mono">resource_type · resource_key</text><text x="53" y="1079" class="mono">resolution</text><rect x="475" y="955" width="450" height="157" rx="11" fill="#f8fafc" stroke="#b4c3cf"/><text x="493" y="984" class="head">cross_request_conflicts</text><text x="493" y="1010" class="mono">id PK · request_id → requests</text><text x="493" y="1033" class="mono">sub_task_id · thread_id</text><text x="493" y="1056" class="mono">conflicting_thread_id · source</text><text x="493" y="1079" class="mono">UNIQUE(resource_id, window, …)</text><rect x="965" y="955" width="400" height="157" rx="11" fill="#f8fafc" stroke="#b4c3cf"/><text x="983" y="984" class="head">release_gate_verdicts</text><text x="983" y="1010" class="mono">id PK · use_case · code_version</text><text x="983" y="1033" class="mono">verdict PASS | FAIL</text><text x="983" y="1056" class="mono">split = heldout · evidence</text><text x="983" y="1079" class="mono">gates the routing catalog</text><text x="35" y="1180" class="cap">LANGGRAPH CHECKPOINTS · LIBRARY-MANAGED</text><rect x="35" y="1200" width="610" height="111" rx="11" fill="#dbe6ee" stroke="#b4c3cf"/><text x="53" y="1229" class="head">PostgresSaver</text><text x="53" y="1255" class="mono">checkpoints · checkpoint_blobs · checkpoint_writes</text><text x="53" y="1278" class="mono">keyed by thread_id · PostgresSaver.setup()</text><text x="690" y="1240" class="body">Joins to agent_jobs.thread_id: paused graph state lives here.</text><text x="690" y="1270" class="mono">also: thread_registry · audit_view_cleared</text><text x="690" y="1300" class="mono">schema_migrations</text><text x="35" y="1390" class="body">Approvals, writes, audit and conflicts trace back to each job’s thread_id.</text></svg>